<!DOCTYPE html>
<html lang="en" class="light">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ABC Bank</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="/assets/images/abc-bank-logo.jpeg">
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <link rel="stylesheet" href="/styles/register.css">
  
</head>

<body class="min-h-screen flex">

<main class="flex w-full min-h-screen">

  <!-- LEFT VIDEO SECTION - using section tag -->
  <section class="hidden md:block md:w-2/3 relative h-screen overflow-hidden">
    <video autoplay muted loop playsinline
      class="absolute top-0 left-0 w-full h-full object-cover">
      <source src="/assets/videos/bank-bg.mp4" type="video/mp4">
    </video>
    <section class="video-overlay absolute inset-0"></section>
  </section>

  <!-- REGISTER FORM SECTION - using section tag -->
  <section class="panel w-full md:w-1/3 flex items-center justify-center p-10 shadow-2xl">

    <article class="w-full max-w-md">

      <!-- ── Dark mode toggle ──────────────────────────────────────── -->
      <section class="controls-row">
        <section class="theme-toggle" title="Toggle dark mode">
          <i class="fa-solid fa-sun toggle-icon"></i>
          <label class="toggle-switch" aria-label="Toggle dark mode">
            <input type="checkbox" id="darkToggle">
            <span class="toggle-track"></span>
            <span class="toggle-knob"></span>
          </label>
          <i class="fa-solid fa-moon toggle-icon"></i>
        </section>
      </section>

      <header class="text-center mb-8">
        <img src="/assets/images/abc-bank-logo.jpeg" class="h-36 w-auto mx-auto mb-6 object-contain" alt="ABC Bank Logo">
        <h2 class="text-head text-3xl font-bold font-[Playfair_Display]" data-i18n="reg_title">Create Account</h2>
        <p class="text-sub text-sm" data-i18n="reg_subheading">Register to start your banking journey</p>
      </header>

      <form id="registerForm" class="space-y-4">

        <section class="grid grid-cols-2 gap-4">
          <input id="fname" type="text" required
            data-i18n-placeholder="reg_fname" placeholder="First Name"
            class="form-input border rounded-lg p-3 w-full">
          <input id="lname" type="text" required
            data-i18n-placeholder="reg_lname" placeholder="Last Name"
            class="form-input border rounded-lg p-3 w-full">
        </section>

        <input id="email" type="email" required
          data-i18n-placeholder="reg_email_placeholder" placeholder="Email"
          class="form-input border rounded-lg p-3 w-full">

        <input id="mobile" type="tel" required
          data-i18n-placeholder="reg_phone_placeholder" placeholder="Mobile Number"
          class="form-input border rounded-lg p-3 w-full">

        <input id="dob" type="date" required
          class="form-input border rounded-lg p-3 w-full">

        <section class="grid grid-cols-2 gap-4">
          <input id="password" type="password" required minlength="8"
            data-i18n-placeholder="reg_password_placeholder" placeholder="Password"
            class="form-input border rounded-lg p-3 w-full">
          <input id="confirmPassword" type="password" required
            data-i18n-placeholder="reg_confirm_placeholder" placeholder="Confirm Password"
            class="form-input border rounded-lg p-3 w-full">
        </section>

        <label class="form-check-label flex items-start gap-2 text-sm">
          <input type="checkbox" id="termsCheck" required class="mt-1">
          <span data-i18n="reg_terms">I agree to the Terms and Privacy Policy</span>
        </label>

        <button type="submit" class="btn-primary w-full text-white p-3 rounded-lg font-semibold">
          <i class="fa fa-user-plus mr-2"></i>
          <span data-i18n="reg_btn">Create Account</span>
        </button>

      </form>

      <footer class="text-center text-sm mt-6">
        <p class="text-sub">
          <span data-i18n="reg_have_account">Already have an account?</span>
          <a href="/pages/login.html" class="link-blue font-semibold hover:underline ml-1"
            data-i18n="reg_signin_link">Sign In →</a>
        </p>
      </footer>

    </article>
  </section>

</main>

<script src="/utils/lang.js"></script>
<script src="/utils/logic.js"></script>
<script src="/utils/register.js"></script>


</body>
</html>
