<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Bank LMS Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="/assets/images/abc-bank-logo.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <link href="/styles/login.css" rel="stylesheet">
  
</head>

<body class="min-h-screen flex">

<main class="flex w-full min-h-screen">

  <!-- LEFT VIDEO SECTION -->
  <section class="hidden md:block md:w-2/3 relative h-screen overflow-hidden">
    <video autoplay muted loop playsinline class="absolute top-0 left-0 w-full h-full object-cover">
      <source src="/assets/videos/bank-bg.mp4" type="video/mp4">
    </video>
    <section class="video-overlay absolute inset-0"></section>
  </section>

  <!-- LOGIN FORM SECTION -->
  <section class="panel w-full md:w-1/3 flex items-center justify-center p-10 shadow-2xl">

    <article class="w-full max-w-md">

      <!-- ── Controls: Language selector + Dark mode toggle ─────────
           Placed at the TOP of the article inside the white panel.
           No fixed/absolute positioning — zero overlap risk.
      ──────────────────────────────────────────────────────────────── -->
      <section class="controls-row">
        <section class="theme-toggle" title="Toggle dark mode">
          <i class="fa-solid fa-sun toggle-icon"></i>
          <label class="toggle-switch" aria-label="Toggle dark mode">
            <input type="checkbox" id="darkToggle">
            <span class="toggle-track"></span>
            <span class="toggle-knob"></span>
          </label>
          <i class="fa-solid fa-moon toggle-icon"></i>
        </section>
      </section>

      <header class="text-center mb-8">
        <img src="/assets/images/abc-bank-logo.jpeg" class="h-36 w-auto mx-auto mb-6 object-contain">
        <h2 class="text-head text-3xl font-bold font-[Playfair_Display]" data-i18n="login_heading">Sign In</h2>
        <p class="text-sub text-sm" data-i18n="login_subheading">Access your ABC Bank account</p>
      </header>

      <form id="loginForm" class="space-y-5">

        <section>
          <label class="form-label block text-sm font-medium mb-1" data-i18n="login_email">Email</label>
          <input id="email" type="email" required placeholder="john@email.com"
            class="form-input w-full p-3 border rounded-lg transition">
        </section>

        <section>
          <label class="form-label block text-sm font-medium mb-1" data-i18n="login_password">Password</label>
          <input id="password" type="password" required minlength="8" maxlength="20"
            class="form-input w-full p-3 border rounded-lg transition"
            data-i18n-placeholder="login_password_placeholder">
        </section>

        <section class="text-center">
          <a href="/pages/forgot-password.html" class="link-blue text-sm underline"
            data-i18n="login_forgot">Forgot Password?</a>
        </section>

        <button type="submit"
          class="btn-primary w-full text-white p-3 rounded-lg font-semibold transition">
          <i class="fa fa-right-to-bracket mr-2"></i>
          <span data-i18n="login_btn">Sign In</span>
        </button>

      </form>

      <footer class="text-center text-sm mt-6">
        <p class="text-sub">
          <span data-i18n="login_no_account">Don't have an account?</span>
          <a href="/pages/register.html" class="link-blue font-semibold hover:underline ml-1"
            data-i18n="login_register_link">Register →</a>
        </p>
      </footer>

    </article>
  </section>

</main>

<script src="/utils/logic.js"></script>
<script src="/utils/lang.js"></script>
<script src="/utils/login.js"></script>


</body>
</html>
