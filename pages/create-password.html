<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password | ABC Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="/assets/images/abc-bank-logo.jpeg">
  <link href="/styles/forgot-password.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <section class="panel w-full max-w-md rounded-2xl shadow-2xl p-10">

    <!-- Dark mode toggle -->
    <section class="controls-row">
      <section class="theme-toggle" title="Toggle dark mode">
        <i class="fa-solid fa-sun toggle-icon"></i>
        <label class="toggle-switch" aria-label="Toggle dark mode">
          <input type="checkbox" id="darkToggle">
          <span class="toggle-track"></span>
          <span class="toggle-knob"></span>
        </label>
        <i class="fa-solid fa-moon toggle-icon"></i>
      </section>
    </section>

    <!-- Header -->
    <header class="text-center mb-8">
      <img src="/assets/images/abc-bank-logo.jpeg" class="h-24 w-auto mx-auto mb-5 object-contain">
      <h2 class="text-head text-3xl font-bold font-[Playfair_Display]">Create New Password</h2>
      <p class="text-sub text-sm mt-1">Your new password must be at least 8 characters.</p>
    </header>

    <!-- Form -->
    <form id="createPasswordForm" class="space-y-5">

      <!-- New Password -->
      <section class="relative">
        <label class="form-label block text-sm font-medium mb-1">New Password</label>
        <input type="password" id="newPassword" required
          class="form-input w-full p-3 border rounded-lg transition pr-10"
          placeholder="Enter new password">
        <i class="fa fa-eye absolute right-3 top-10 cursor-pointer text-gray-400 toggle-pw" data-target="newPassword"></i>
      </section>

      <!-- Confirm Password -->
      <section class="relative">
        <label class="form-label block text-sm font-medium mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required
          class="form-input w-full p-3 border rounded-lg transition pr-10"
          placeholder="Re-enter new password">
        <i class="fa fa-eye absolute right-3 top-10 cursor-pointer text-gray-400 toggle-pw" data-target="confirmPassword"></i>
      </section>

      <!-- Strength bar -->
      <section>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div id="strengthBar" class="h-2 rounded-full transition-all duration-300" style="width:0%"></div>
        </div>
        <p id="strengthLabel" class="text-xs mt-1 text-sub"></p>
      </section>

      <button type="submit" class="btn-primary w-full text-white p-3 rounded-lg font-semibold transition">
        <i class="fa fa-lock mr-2"></i> Save New Password
      </button>

    </form>

    <footer class="text-center text-sm mt-6">
      <a href="/pages/login.html" class="link-blue hover:underline">← Back to Login</a>
    </footer>

  </section>

  <script src="/utils/lang.js"></script>
  <script src="/utils/create-password.js"></script>
</body>
</html>
