<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | ABC Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link rel="icon" type="image/x-icon" href="/assets/images/abc-bank-logo.jpeg">
   <link href="/styles/forgot-password.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <section class="panel w-full max-w-md rounded-2xl shadow-2xl p-10">

    <!-- ── Controls: Lang switcher + Dark mode toggle ───────────────── -->
    <section class="controls-row">

      <!-- Dark mode toggle -->
      <section class="theme-toggle" title="Toggle dark mode">
        <i class="fa-solid fa-sun toggle-icon"></i>
        <label class="toggle-switch" aria-label="Toggle dark mode">
          <input type="checkbox" id="darkToggle">
          <span class="toggle-track"></span>
          <span class="toggle-knob"></span>
        </label>
        <i class="fa-solid fa-moon toggle-icon"></i>
      </section>

    </section>

    <!-- Header -->
    <header class="text-center mb-8">
      <img src="/assets/images/abc-bank-logo.jpeg" class="h-24 w-auto mx-auto mb-5 object-contain">
      <h2 class="text-head text-3xl font-bold font-[Playfair_Display]" data-i18n="forgot_title">Forgot Password</h2>
      <p class="text-sub text-sm mt-1" data-i18n="forgot_description">Enter your details to reset your password.</p>
    </header>

    <!-- Form -->
    <form id="forgotForm" class="space-y-5">

      <section>
        <label class="form-label block text-sm font-medium mb-1" data-i18n="forgot_input_label">Email / Username</label>
        <input type="text" required
          class="form-input w-full p-3 border rounded-lg transition"
          data-i18n-placeholder="forgot_input_placeholder"
          placeholder="john@email.com">
      </section>

      <button type="submit"
        class="btn-primary w-full text-white p-3 rounded-lg font-semibold transition">
        <i class="fa fa-paper-plane mr-2"></i>
        <span data-i18n="forgot_btn">Send Reset Link</span>
      </button>

    </form>

    <!-- Back to login -->
    <footer class="text-center text-sm mt-6">
      <a href="/pages/login.html" class="link-blue hover:underline" data-i18n="forgot_back_login">
        ← Back to Login
      </a>
    </footer>

  </section>

  <script src="/utils/lang.js"></script>
  <script src="/utils/forgot-password.js"></script>
  

</body>
</html>
